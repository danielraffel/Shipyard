on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  # Run the required `Enforce version & skill sync` gate on queued merge groups
  # so a merge queue on `main` can land PRs. On merge_group the diff base
  # resolves to origin/main (see the "Resolve diff base" step).
  merge_group:
  workflow_dispatch:
    inputs:
      runner_provider:
        description: "Runner provider (github-hosted or namespace)"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
