name: Auto-Release on CLI Version Bump

# On every push to main, diff Cargo.toml's package.version against the
# previous push range. The version-at-land writer creates that movement;
# if it moved, create the matching v<x.y.z> tag;
# release.yml then builds draft release assets from the tag.
#
# The tag is pushed with a shipyard-local GitHub App installation token
# (secret SHIPYARD_APP_PRIVATE_KEY), scoped to this
# repository with contents write only: a tag pushed by the default workflow
# token would start no release.yml run. Without the App credentials the run
# fails rather than falling back to the default token. The key is a secret of
# the `automation` environment, whose deployment policy admits branch main
# only, so a run from any other ref (or from a tag) never sees it and stops at
# the credential check.
#
# The workflow also supports workflow_dispatch so `shipyard doctor
# --release-chain` can verify that the release token is accepted. A manual
# dispatch with no version movement is a no-op after checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    name: Tag CLI version bumps
    environment: automation

    steps:
      - name: Require release App credentials
        env:
          SHIPYARD_APP_PRIVATE_KEY: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$SHIPYARD_APP_PRIVATE_KEY" ]; then
            echo '::error::Shipyard release App credentials are required (secret SHIPYARD_APP_PRIVATE_KEY); refusing to create an untriggering tag.' >&2
            exit 1
          fi

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The shipyard-local App's public client ID. With no owner or
          # repositories input the token is scoped to this repository only.
          client-id: Iv23liTCzDQWqmMjkDTI
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip on trailer or revert
        id: guard
        shell: bash
        run: |
          subject=$(git log -1 --format=%s HEAD)
          body=$(git log -1 --format=%B HEAD)
          if echo "$body" | git interpret-trailers --parse | grep -iq '^release: skip'; then
              echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$subject" =~ ^[Rr]evert ]]; then
              echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$body" | git interpret-trailers --parse | grep -iq '^revert-of:'; then
              echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Read Cargo package version at before/after
        id: versions
        if: steps.guard.outputs.skip == '0'
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="HEAD~1"
          fi

          extract_cargo_version() {
              local ref="$1"
              git show "${ref}:Cargo.toml" 2>/dev/null \
                | python3 -c 'import re, sys; text = sys.stdin.read(); m = re.search(r"(?ms)^\[package\].*?^\s*version\s*=\s*\"([^\"]+)\"", text); print(m.group(1) if m else "")'
          }

          v_before=$(extract_cargo_version "$before" || true)
          v_after=$(extract_cargo_version HEAD || true)

          echo "before=$v_before" >> "$GITHUB_OUTPUT"
          echo "after=$v_after" >> "$GITHUB_OUTPUT"
          echo "Cargo package version: $v_before -> $v_after"

      - name: Create tag if Rust CLI version moved
        if: steps.guard.outputs.skip == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          V_BEFORE: ${{ steps.versions.outputs.before }}
          V_AFTER: ${{ steps.versions.outputs.after }}
        run: |
          set -euo pipefail

          if [ -z "$V_AFTER" ] || [ "$V_BEFORE" = "$V_AFTER" ]; then
              echo "Rust CLI version unchanged - no tagging."
              exit 0
          fi

          tag="v${V_AFTER}"

          test -n "$GH_TOKEN" || { echo 'Release App token is required; refusing to create an untriggering tag.' >&2; exit 1; }
          # git authenticates through gh, which reads GH_TOKEN (the App token).
          gh auth setup-git

          git config user.name "shipyard-release-bot"
          git config user.email "shipyard-release-bot@users.noreply.github.com"

          if git ls-remote --tags origin "$tag" | grep -q .; then
              remote_target=$(git ls-remote --tags origin "${tag}^{}" | awk '{print $1}')
              if [ -z "$remote_target" ]; then
                  remote_target=$(git ls-remote --tags origin "$tag" | awk '{print $1}')
              fi
              local_sha=$(git rev-parse HEAD)
              if [ "$remote_target" = "$local_sha" ]; then
                  echo "tag $tag already at $local_sha - no-op"
                  exit 0
              fi
              echo "ERROR: tag $tag exists at $remote_target but HEAD is $local_sha" >&2
              echo "Manual reconciliation required." >&2
              exit 1
          fi

          git tag -a "$tag" -m "Release $tag (automated by auto-release.yml)"
          git push origin "$tag"
          echo "created $tag"
