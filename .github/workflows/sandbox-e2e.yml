name: Sandbox E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for sandbox jobs
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
          - local
      linux_runner_selector_json:
        description: Optional JSON string/array for Linux runs-on
        required: false
        default: ""
        type: string
      macos_arm64_runner_selector_json:
        description: Optional JSON string/array for macOS ARM64 runs-on
        required: false
        default: ""
        type: string

concurrency:
  group: sandbox-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        env:
          REQUESTED_PROVIDER: ${{ inputs.runner_provider || vars.DEFAULT_RUNNER_PROVIDER || 'github-hosted' }}
          EXPLICIT_LINUX_RUNNER_SELECTOR_JSON: ${{ inputs.linux_runner_selector_json || '' }}
          EXPLICIT_MACOS_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.macos_arm64_runner_selector_json || '' }}
          NAMESPACE_LINUX_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_RUNS_ON_JSON }}
          NAMESPACE_MACOS_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_MACOS_ARM64_RUNS_ON_JSON }}
        run: python3 scripts/ci_matrix.py --workflow sandbox-e2e --github-output

  sandbox:
    needs: resolve-runners
    name: ${{ matrix.name }} [${{ matrix.provider }}]
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin shipyard

      - name: Install pytest
        run: |
          python3 -m venv .venv-sandbox
          .venv-sandbox/bin/python -m pip install pytest

      - name: Run sandbox E2E
        # M3's ephemeral Tart runners use Shipyard-studio-NN. Keep the target,
        # provider, and host identity conjunctive so an explicit local selector
        # for M1/M5 cannot unexpectedly run this host-specific canary.
        if: ${{ !(matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-')) }}
        env:
          SHIPYARD_BINARY_FOR_TEST: ${{ github.workspace }}/target/release/shipyard
        run: .venv-sandbox/bin/python -m pytest tools/sandbox-e2e/

      - name: Run exact isolated M3 candidate and focused Sandbox
        if: ${{ matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-') }}
        env:
          SHIPYARD_BINARY_FOR_TEST: ${{ github.workspace }}/target/release/shipyard
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "Shipyard-studio-02"
          test "$(hostname)" = "Daniels-Mac-Studio.local"
          installed="$HOME/.local/bin/shipyard"
          test -x "$installed"
          test "$($installed runner tag)" = "studio"
          canary_root="/tmp/shipyard-sandbox-m3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lease_dir="/tmp/shipyard-sandbox-m3-lease"
          umask 077
          mkdir "$lease_dir"
          mkdir -p "$canary_root/global" "$canary_root/state"
          candidate="$canary_root/shipyard-candidate"
          cp "$SHIPYARD_BINARY_FOR_TEST" "$candidate"
          chmod 700 "$candidate"
          guardian="$canary_root/sandbox-daemon-guardian.sh"
          cp "$GITHUB_WORKSPACE/scripts/sandbox_daemon_guardian.sh" "$guardian"
          chmod 700 "$guardian"
          candidate_hash="$(shasum -a 256 "$candidate" | awk '{print $1}')"
          installed_hash="$(shasum -a 256 "$installed" | awk '{print $1}')"
          candidate_status="$($candidate --version)"
          installed_status="$($installed --version)"
          installed_argv="$(pgrep -f 'shipyard.*daemon run' | xargs -r ps -o command= -p 2>/dev/null || true)"
          "$installed" --json daemon status > "$canary_root/pre-daemon-status.json"
          jq -S '[(.configured_repos // .registered_repos // [])[]] | sort' \
            "$canary_root/pre-daemon-status.json" > "$canary_root/pre-configured-repos.json"
          "$installed" --json status > "$canary_root/pre-worker-status.json"
          production_pid="$(tr -d '[:space:]' < "$HOME/Library/Application Support/shipyard/daemon/daemon.pid")"
          printf '%s\n' "$production_pid" > "$canary_root/pre-production.pid"
          production_command="$(ps -p "$production_pid" -o command=)"
          printf '%s\n' "$production_command" | grep -F -- "$installed"
          printf '%s\n' "$production_command" | grep -F -- "--mode shipyard"
          printf '%s\n' "$production_command" | grep -F -- "daemon run"
          ps -p "$production_pid" -o command= > "$canary_root/pre-command.txt"
          lsof -a -p "$production_pid" -d cwd -Fn > "$canary_root/pre-cwd.txt"
          ps eww -p "$production_pid" -o command= | shasum -a 256 > "$canary_root/pre-env.sha256"
          record="$canary_root/bootstrap.json"
          jq -n \
            --arg candidate "$candidate" --arg candidate_hash "$candidate_hash" \
            --arg candidate_status "$candidate_status" \
            --arg installed "$installed" --arg installed_hash "$installed_hash" \
            --arg installed_status "$installed_status" --arg installed_argv "$installed_argv" \
            '{candidate:$candidate,candidate_sha256:$candidate_hash,candidate_status:$candidate_status,installed:$installed,installed_sha256:$installed_hash,installed_status:$installed_status,installed_argv:$installed_argv}' \
            > "$record"
          guardian_label="com.danielraffel.shipyard.sandbox-canary.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          guardian_plist="$canary_root/guardian.plist"
          cat > "$guardian_plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>$guardian_label</string>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><false/>
            <key>ProgramArguments</key><array>
              <string>/bin/bash</string><string>$guardian</string><string>$$</string>
              <string>$candidate</string><string>$canary_root/global</string>
              <string>$canary_root/state</string><string>$canary_root/done</string>
              <string>$canary_root/guardian-receipt.json</string><string>$lease_dir</string>
              <string>$guardian_label</string>
            </array>
          </dict></plist>
          PLIST
          plutil -lint "$guardian_plist"
          launchctl bootstrap "gui/$(id -u)" "$guardian_plist"
          /usr/bin/env -u RUNNER_TRACKING_ID "$candidate" --mode isolated \
            --global-dir "$canary_root/global" --state-dir "$canary_root/state" daemon start
          "$candidate" --mode isolated --global-dir "$canary_root/global" \
            --state-dir "$canary_root/state" --json daemon status > "$canary_root/candidate-status.json"
          jq -e '.running == true and .tunnel.backend == "inactive" and ((.configured_repos // []) == []) and ((.registered_repos // []) == [])' \
            "$canary_root/candidate-status.json"
          candidate_pid="$(pgrep -f "^${candidate//\//\\/} .*daemon run" | head -1)"
          test -n "$candidate_pid"
          printf '%s\n' "$candidate_pid" > "$canary_root/candidate.pid"
          ps -p "$candidate_pid" -o command= | grep -F -- "$candidate"
          if ps eww -p "$candidate_pid" -o command= | grep -q 'RUNNER_TRACKING_ID='; then
            echo "candidate daemon inherited Actions orphan tracking" >&2
            exit 1
          fi
          state_dir="$($candidate --mode isolated --global-dir "$canary_root/global" --state-dir "$canary_root/state" --json paths | jq -r .state_dir)"
          if lsof "$state_dir/.sandbox-writer-domain.lock" > "$RUNNER_TEMP/candidate-lock-holders.txt" 2>&1; then
            echo "candidate daemon retains an idle writer-domain lock" >&2
            cat "$RUNNER_TEMP/candidate-lock-holders.txt" >&2
            exit 1
          fi
          .venv-sandbox/bin/python -m pytest tools/sandbox-e2e/
          touch "$canary_root/done"

      - name: Verify M3 guardian and production daemon invariants
        if: ${{ always() && matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-') }}
        run: |
          set -euo pipefail
          installed="$HOME/.local/bin/shipyard"
          test -x "$installed"
          canary_root="/tmp/shipyard-sandbox-m3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deadline=$((SECONDS + 15))
          while [ ! -s "$canary_root/guardian-receipt.json" ] && [ "$SECONDS" -lt "$deadline" ]; do sleep 1; done
          jq -e '.candidate_stopped == true' "$canary_root/guardian-receipt.json"
          candidate_pid="$(tr -d '[:space:]' < "$canary_root/candidate.pid")"
          if kill -0 "$candidate_pid" 2>/dev/null; then
            echo "candidate daemon survived guardian cleanup" >&2
            exit 1
          fi
          "$installed" --json daemon status > "$canary_root/post-daemon-status.json"
          jq -S '[(.configured_repos // .registered_repos // [])[]] | sort' "$canary_root/post-daemon-status.json" > "$canary_root/post-configured-repos.json"
          cmp "$canary_root/pre-configured-repos.json" "$canary_root/post-configured-repos.json"
          production_pid="$(tr -d '[:space:]' < "$HOME/Library/Application Support/shipyard/daemon/daemon.pid")"
          printf '%s\n' "$production_pid" > "$canary_root/post-production.pid"
          cmp "$canary_root/pre-production.pid" "$canary_root/post-production.pid"
          ps -p "$production_pid" -o command= > "$canary_root/post-command.txt"
          lsof -a -p "$production_pid" -d cwd -Fn > "$canary_root/post-cwd.txt"
          ps eww -p "$production_pid" -o command= | shasum -a 256 > "$canary_root/post-env.sha256"
          cmp "$canary_root/pre-command.txt" "$canary_root/post-command.txt"
          cmp "$canary_root/pre-cwd.txt" "$canary_root/post-cwd.txt"
          cmp "$canary_root/pre-env.sha256" "$canary_root/post-env.sha256"
          "$installed" --json status > "$canary_root/post-worker-status.json"
          jq -S '[.active_runs[]?.id] | sort' "$canary_root/pre-worker-status.json" > "$canary_root/pre-worker-ids.json"
          jq -S '[.active_runs[]?.id] | sort' "$canary_root/post-worker-status.json" > "$canary_root/post-worker-ids.json"
          cmp "$canary_root/pre-worker-ids.json" "$canary_root/post-worker-ids.json"

      - name: Upload sandbox tempdir on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-e2e-${{ matrix.name }}-logs
          # Sandbox tempdirs come from tempfile.mkdtemp(...), which honors
          # TMPDIR/platform defaults. GitHub macOS runners use
          # /private/var/folders/... rather than /tmp, so cover both.
          path: |
            /tmp/shipyard-sandbox-e2e.*/**
            /private/var/folders/**/shipyard-sandbox-e2e.*/**
            /var/folders/**/shipyard-sandbox-e2e.*/**
          if-no-files-found: ignore
          retention-days: 7
