# Shipyard validates itself.
# This config is what runs when you do `shipyard run` in this repo.

# Formal GitHub stacks remain fail-closed. Repositories may select `observe`
# for exact-head plan telemetry; `apply` is reserved and currently NO-GO.
stacked_pr_mode = "off"

[project]
name = "shipyard"
type = "rust"
platforms = ["macos", "linux", "windows"]

# What CI runs (see .github/workflows/ci.yml). Keep in sync.
# Find a cargo that actually runs (the `~/.cargo/bin/cargo` rustup shim
# is broken on some hosts after partial rustup updates), then exec the
# pipeline through that.
[validation.default]
command = "_sy_find_cargo_bin() { for c in cargo \"$HOME/.cargo/bin/cargo\"; do command -v \"$c\" >/dev/null 2>&1 && \"$c\" fmt --version >/dev/null 2>&1 && { dirname \"$(command -v \"$c\")\"; return 0; }; done; for c in \"$HOME\"/.rustup/toolchains/*/bin/cargo; do [ -x \"$c\" ] && \"$c\" --version >/dev/null 2>&1 && { dirname \"$c\"; return 0; }; done; return 1; }; CARGO_BIN=$(_sy_find_cargo_bin) || { echo 'shipyard validation: could not locate a working cargo (with rustfmt + clippy) binary' >&2; exit 1; }; export PATH=\"$CARGO_BIN:$PATH\"; SHIPYARD_TEST_HOME=$(mktemp -d \"${TMPDIR:-/tmp}/shipyard-test-home.XXXXXX\") || { echo 'shipyard validation: could not create isolated test home' >&2; exit 1; }; export SHIPYARD_TEST_HOME RUST_MIN_STACK=8388608; trap 'rm -rf -- \"$SHIPYARD_TEST_HOME\"' EXIT; cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --all-targets --locked --features ci-test-home"

[targets.mac]
backend = "local"
platform = "macos-arm64"
validation_build_type = "debug"

[release.changelog]
enabled    = true
path       = "CHANGELOG.md"
repo_url   = "https://github.com/danielraffel/Shipyard"
tag_filter = "v*"
product    = "Shipyard"
skip_commit_patterns = [
  "^chore: bump",
  "^chore\\(release\\):",
  "^bump .*to v?\\d+\\.\\d+\\.\\d+$",
]

[release.post_tag_hook]
enabled              = true
command              = "shipyard changelog regenerate"
watch                = ["CHANGELOG.md"]
trailers = [
  'Version-Bump: sdk=skip reason="docs-only automated regeneration"',
  'Skill-Update: skip skill=ci reason="no workflow shape change"',
  'Release: skip reason="bot commit; prevent recursive auto-release"',
]
only_for_tag_pattern = "v*"
max_push_attempts    = 5
# Shipyard dogfoods its hook while the triggering release is still a draft.
# Resolve the latest already-published, checksum-verified CLI instead of
# racing assets for the new tag. Consumer repositories remain pinned by
# default unless they opt into this explicitly.
workflow_shipyard_version = "latest"

[release.post_tag_hook.bot_identity]
name  = "shipyard-release-bot"
email = "shipyard-release-bot@users.noreply.github.com"
