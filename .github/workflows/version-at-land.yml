name: Assign versions at land

# PRs never carry the shared version counters. This single writer runs after
# every push to main, assigns the highest required level in the unprocessed
# range, and commits the files to the bot-owned release/version-at-land branch.
# Main's ruleset requires checks only a pull request carries, so the bump lands
# through one coalesced pull request: every run rebuilds that branch from the
# main tip with the cumulative bump and keeps the same pull request open. The
# pull request is handed to the merge steward (managed label plus an exact-head
# handoff status) and still needs green required checks and a reviewer's
# exact-head approval. auto-release.yml tags its merge. A run on that merge has
# nothing left to assign and is a no-op.
#
# A shipyard-local GitHub App installation token pushes the branch and opens
# the pull request: events from the default workflow token start no workflows,
# and the required checks must run on the pull request. The token is minted
# per run, scoped to this repository, and carries only the permissions the
# bump needs. The App's private key is the SHIPYARD_APP_PRIVATE_KEY
# repository secret; without it the run fails rather than falling back to the
# default token.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-at-land
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Require release App credentials
        env:
          SHIPYARD_APP_PRIVATE_KEY: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$SHIPYARD_APP_PRIVATE_KEY" ]; then
            echo '::error::Shipyard release App credentials are required (secret SHIPYARD_APP_PRIVATE_KEY); refusing to land an untagged version bump.' >&2
            exit 1
          fi

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The shipyard-local App's public client ID. With no owner or
          # repositories input the token is scoped to this repository only.
          client-id: Iv23liTCzDQWqmMjkDTI
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          # Push the bump branch; open, edit and label the bump pull request
          # (pull request write covers labels on a pull request); post the
          # exact-head handoff status.
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          # The bump branch is rebuilt from the main tip and force-pushed; when
          # main changed .github/workflows since the last bump, GitHub refuses
          # that ref update from an App token without workflows write.
          permission-workflows: write

      - name: Checkout main with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Assign the next version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: shipyard-release-bot
          GIT_AUTHOR_EMAIL: shipyard-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: shipyard-release-bot
          GIT_COMMITTER_EMAIL: shipyard-release-bot@users.noreply.github.com
        run: |
          test -n "$GH_TOKEN" || { echo 'Release App token is required; refusing to land an untagged version bump.' >&2; exit 1; }
          # git authenticates through gh, which reads GH_TOKEN (the App token).
          gh auth setup-git
          python3 scripts/version_at_land.py --push --pr-branch release/version-at-land \
            --repo "$GITHUB_REPOSITORY" --target-url "$RUN_URL" --json
