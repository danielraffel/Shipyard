name: Versioning & Skill-Sync

# Authoritative gate for Shipyard's versioning/skill-sync policy.
# Mirrors the pulp-side workflow — same scripts, Shipyard-specific config.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-skill-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-skill-check:
    runs-on: ubuntu-latest
    name: Enforce version & skill sync

    env:
      SHIPYARD_ENFORCE_PREPUSH: "1"

    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve diff base
        id: base
        # A pull_request run checks out the merge, so origin/<base> is exact;
        # any other run checks out the bare branch head, whose base is where
        # it left main (scripts/resolve_diff_base.py).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ref="$(python3 scripts/resolve_diff_base.py --event "$EVENT_NAME" --base-ref "$BASE_REF")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Skill-sync check
        run: |
          python3 scripts/skill_sync_check.py \
              --base "${{ steps.base.outputs.ref }}" \
              --config scripts/versioning.json \
              --mode=report

      - name: Version-bump check
        run: |
          python3 scripts/version_bump_check.py \
              --base "${{ steps.base.outputs.ref }}" \
              --config scripts/versioning.json \
              --mode=report

      - name: Doc-sync check
        run: |
          python3 scripts/doc_sync_check.py \
              --base "${{ steps.base.outputs.ref }}" \
              --map scripts/doc_sync_map.json \
              --mode=report
