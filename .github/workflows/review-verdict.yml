# Posts the `review-verdict` commit status on a pull request's head: the
# server-side twin of queue-arm-guard's review-before-arm rule (see
# docs/review-verdict-status.md). Report-only until branch protection lists it.
#
# Every trigger here runs the default branch's definition of this file:
# pull_request_target and issue_comment always do, and a review reaches it
# through workflow_run of the permission-less "Review verdict trigger". The
# job checks out the default branch and never the pull request's code.
name: Review verdict

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review verdict trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

# One group per pull request on every path, so a review's run and a comment's
# run on the same pull request queue behind each other instead of racing; a
# fork's review lists no pull request and falls back to its head.
concurrency:
  group: review-verdict-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review-verdict:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
      - name: Post review-verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${{ steps.python.outputs.python-path }}" scripts/review_verdict_status.py'
