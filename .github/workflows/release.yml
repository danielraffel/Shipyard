name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for release jobs
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
          - local
      linux_runner_selector_json:
        description: Optional JSON string/array for Linux x64 runs-on
        required: false
        default: ""
        type: string
      linux_arm64_runner_selector_json:
        description: Optional JSON string/array for Linux ARM64 runs-on
        required: false
        default: ""
        type: string
      macos_arm64_runner_selector_json:
        description: Optional JSON string/array for macOS ARM64 runs-on
        required: false
        default: ""
        type: string
      windows_runner_selector_json:
        description: Optional JSON string/array for Windows runs-on
        required: false
        default: ""
        type: string

# Each job grants only what its own steps use; nothing is granted by default.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      macos_arm64_runs_on_json: ${{ steps.resolve.outputs.macos_arm64_runs_on_json }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: resolve
        env:
          REQUESTED_PROVIDER: ${{ inputs.runner_provider || vars.DEFAULT_RUNNER_PROVIDER || 'github-hosted' }}
          EXPLICIT_LINUX_RUNNER_SELECTOR_JSON: ${{ inputs.linux_runner_selector_json || '' }}
          EXPLICIT_LINUX_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.linux_arm64_runner_selector_json || '' }}
          EXPLICIT_MACOS_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.macos_arm64_runner_selector_json || '' }}
          EXPLICIT_WINDOWS_RUNNER_SELECTOR_JSON: ${{ inputs.windows_runner_selector_json || '' }}
          NAMESPACE_LINUX_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_RUNS_ON_JSON }}
          NAMESPACE_LINUX_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_ARM64_RUNS_ON_JSON }}
          NAMESPACE_MACOS_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_MACOS_ARM64_RUNS_ON_JSON }}
          NAMESPACE_WINDOWS_RUNS_ON_JSON: ${{ vars.NAMESPACE_WINDOWS_RUNS_ON_JSON }}
        run: python3 scripts/ci_matrix.py --workflow release --github-output

  build:
    needs: resolve-runners
    name: Build ${{ matrix.package_target }} [${{ matrix.provider }}]
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate release runner architecture
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "${{ matrix.package_target }}" in
            linux-arm64|macos-arm64)
              echo "$machine" | grep -Eq '^(aarch64|arm64)$'
              ;;
            linux-x64|windows-x64)
              echo "$machine" | grep -Eq '^(x86_64|amd64)$'
              ;;
            *)
              echo "unknown package target: ${{ matrix.package_target }}" >&2
              exit 2
              ;;
          esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: stable

      # No cargo cache: release binaries build from a clean target/, and a tag
      # ref can only restore its own or main's entries, neither of which holds
      # a release-profile build, so the cache never hit and only filled quota.
      - name: Build release binaries
        run: cargo build --release --locked --bin shipyard --bin shipyard-workstream-provider

      - name: Package non-macOS artifact
        if: matrix.package_target != 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} scripts/package_release.py \
            --skip-build \
            --binary "${{ matrix.binary }}" \
            --companion-binary "${{ matrix.companion_binary }}" \
            --target "${{ matrix.package_target }}" \
            --tag "${{ github.ref_name }}" \
            --dist-dir artifacts/release

      - name: Upload non-macOS artifact
        if: matrix.package_target != 'macos-arm64'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.package_target }}
          path: artifacts/release/${{ github.ref_name }}/*
          if-no-files-found: error

      - name: macOS build health check only
        if: matrix.package_target == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          target/release/shipyard --version
          target/release/shipyard-workstream-provider --version
          echo "macOS release artifacts are intentionally not uploaded from this unsigned build."
          echo "Run scripts/release-macos-local.sh --tag ${{ github.ref_name }} --upload to sign, notarize, upload, verify, and publish."

  # Release gate: the built binary's bulk GitHub reads must succeed against a
  # real repository before anything is published. v0.302.0-v0.307.0 shipped an
  # admission census GitHub refused on every call (GraphQL node limit) and no
  # unit test against a fake could see it. Read-only probes only.
  live-smoke:
    needs: build
    name: Live GitHub smoke (release gate)
    runs-on: ubuntu-latest
    # The job token is handed to the binary under test: read-only, nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the linux-x64 release binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-linux-x64
          path: smoke-bin

      - name: Run read-only admission and steward probes against real repositories
        shell: bash
        env:
          # Public repositories only; a dedicated read token can replace the
          # job token without changing the gate.
          GH_TOKEN: ${{ secrets.RELEASE_SMOKE_GH_TOKEN || github.token }}
          SMOKE_REPOS: ${{ vars.RELEASE_SMOKE_REPOS || 'Generous-Corp/pulp' }}
        run: |
          set -euo pipefail
          binary=smoke-bin/shipyard-linux-x64
          chmod +x "$binary"
          "$binary" --version
          repo_args=()
          for repo in $SMOKE_REPOS; do repo_args+=(--repo "$repo"); done
          python3 scripts/release_live_smoke.py --binary "$binary" "${repo_args[@]}"

  release:
    needs: [build, live-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Creates the draft release (contents) and signs its build provenance.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download non-macOS artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts/

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f ! -name checksums.sha256 -print0 | while IFS= read -r -d '' file; do
            cp "$file" release/
          done
          test "$(find release -type f | wc -l | tr -d ' ')" -gt 0
          cd release
          sha256sum -- * > checksums.sha256

      # Sigstore (fulcio/rekor) has transient TLS and 5xx failures. An attestation
      # is required before any host will install the release, so retry with
      # backoff instead of failing the release on one bad handshake. A
      # deterministic failure fails all three attempts and the job.
      - name: Attest non-macOS release assets (attempt 1)
        id: attest_nonmac_1
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe
      - name: Back off before retrying attestation
        if: steps.attest_nonmac_1.outcome == 'failure'
        run: sleep 30
      - name: Attest non-macOS release assets (attempt 2)
        id: attest_nonmac_2
        if: steps.attest_nonmac_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe
      - name: Back off before the last attestation attempt
        if: steps.attest_nonmac_2.outcome == 'failure'
        run: sleep 90
      - name: Attest non-macOS release assets (attempt 3)
        if: steps.attest_nonmac_2.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          draft: true

  sign-and-upload-macos:
    needs: [resolve-runners, release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.CI_MACOS_SIGNING_ENABLED == 'true'
    runs-on: ${{ fromJSON(needs.resolve-runners.outputs.macos_arm64_runs_on_json) }}
    # Uploads the DMG and publishes the release (contents) after attesting it.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The signed build must not read a toolchain or crate sources that an
      # earlier job on a shared runner could have written to ~/.cargo or
      # ~/.rustup. Fresh homes cost a cold toolchain and registry fetch.
      - name: Isolate the build from shared Rust homes
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/shipyard-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$root"
          mkdir -p "$root/cargo" "$root/rustup"
          echo "CARGO_HOME=$root/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$root/rustup" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: stable

      # No cargo cache: release binaries build from a clean target/, and a tag
      # ref can only restore its own or main's entries, neither of which holds
      # a release-profile build, so the cache never hit and only filled quota.
      - name: Import Developer ID signing identity
        env:
          SIGN_P12_B64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          SIGN_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SIGN_P12_B64:-}" ] || missing+=("MACOS_SIGN_P12_BASE64")
          [ -n "${SIGN_P12_PASSWORD:-}" ] || missing+=("MACOS_SIGN_P12_PASSWORD")
          [ -n "${SIGN_TEAM_ID:-}" ] || missing+=("MACOS_NOTARIZE_TEAM_ID")
          [ -n "${NOTARIZE_APPLE_ID:-}" ] || missing+=("MACOS_NOTARIZE_APPLE_ID")
          [ -n "${NOTARIZE_APP_PASSWORD:-}" ] || missing+=("MACOS_NOTARIZE_APP_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'required secret missing when CI_MACOS_SIGNING_ENABLED=true: %s\n' "${missing[@]}" >&2
            exit 2
          fi
          KEYCHAIN="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.keychain-db"
          KEYCHAIN_STATE="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.json"
          SIGNING_HOME="${RUNNER_TEMP}/shipyard-ci-home-${GITHUB_RUN_ID}"
          CERT_PATH="${RUNNER_TEMP}/shipyard-cert-${GITHUB_RUN_ID}.p12"
          {
            echo "SHIPYARD_SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "SHIPYARD_SIGNING_KEYCHAIN_STATE=$KEYCHAIN_STATE"
            echo "SHIPYARD_SIGNING_HOME=$SIGNING_HOME"
          } >> "$GITHUB_ENV"
          python3 scripts/ci_macos_signing_keychain.py prepare \
            --keychain "$KEYCHAIN" \
            --state "$KEYCHAIN_STATE" \
            --signing-home "$SIGNING_HOME"
          echo "$SIGN_P12_B64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          IDENTITY_SHA="$(security find-identity -p codesigning -v "$KEYCHAIN" \
            | awk -v team="(${SIGN_TEAM_ID})" '/Developer ID Application/ && index($0, team) {print $2; exit}')"
          if [ -z "$IDENTITY_SHA" ]; then
            echo "no Developer ID Application identity for Team ID ${SIGN_TEAM_ID} found in CI keychain" >&2
            exit 2
          fi
          echo "SHIPYARD_SIGNING_IDENTITY=$IDENTITY_SHA" >> "$GITHUB_ENV"
          echo "SHIPYARD_SIGNING_KEYCHAIN_READY=1" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and upload macOS DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The managed wrapper may live outside the service account's home.
          # Leave this empty to resolve the authenticated `ghapp` from PATH.
          SHIPYARD_GHAPP_PATH: ${{ vars.SHIPYARD_GHAPP_PATH || '' }}
          SHIPYARD_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          SHIPYARD_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          SHIPYARD_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Upload only: the release stays a draft until the DMG is attested
          # (next steps), so no host can install a published, unattested build.
          scripts/release-macos-local.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --upload \
            --defer-publish \
            --ci-mode

      # Sigstore (fulcio/rekor) has transient TLS and 5xx failures. An attestation
      # is required before any host will install the release, so retry with
      # backoff instead of failing the release on one bad handshake. A
      # deterministic failure fails all three attempts and the job.
      - name: Attest signed and notarized macOS release asset (attempt 1)
        id: attest_macos_1
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg
      - name: Back off before retrying attestation
        if: steps.attest_macos_1.outcome == 'failure'
        run: sleep 30
      - name: Attest signed and notarized macOS release asset (attempt 2)
        id: attest_macos_2
        if: steps.attest_macos_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg
      - name: Back off before the last attestation attempt
        if: steps.attest_macos_2.outcome == 'failure'
        run: sleep 90
      - name: Attest signed and notarized macOS release asset (attempt 3)
        if: steps.attest_macos_2.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg

      - name: Publish the attested release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SHIPYARD_GHAPP_PATH}" ]]; then
            SHIPYARD_GHAPP_PATH="$(command -v ghapp || true)"
          fi
          if [[ -z "${SHIPYARD_GHAPP_PATH}" || ! -x "${SHIPYARD_GHAPP_PATH}" ]]; then
            echo "authenticated ghapp wrapper is unavailable; set SHIPYARD_GHAPP_PATH or install ghapp on PATH" >&2
            exit 1
          fi
          export SHIPYARD_GHAPP_PATH
          scripts/release-macos-local.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --publish-only \
            --ci-mode

      - name: Restore user keychains and delete ephemeral signing keychain
        if: always()
        shell: bash
        run: |
          KEYCHAIN="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.keychain-db"
          KEYCHAIN_STATE="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.json"
          SIGNING_HOME="${RUNNER_TEMP}/shipyard-ci-home-${GITHUB_RUN_ID}"
          rm -f "${RUNNER_TEMP}/shipyard-cert-${GITHUB_RUN_ID}.p12"
          python3 scripts/ci_macos_signing_keychain.py restore \
            --keychain "$KEYCHAIN" \
            --state "$KEYCHAIN_STATE" \
            --signing-home "$SIGNING_HOME"
