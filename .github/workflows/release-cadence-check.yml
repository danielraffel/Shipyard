name: Release cadence check

# Layer 3 of the release-watchdog triad (docs/release-watchdog.md), ported from
# Pulp's release-cadence-check.yml. It looks only at outcomes, with the default
# token, so it fires whatever broke and does not depend on the release
# workflows it checks:
# - a feat:/fix: pull request merged to main more than two hours ago is in no
#   v* tag and no release/version-at-land pull request is open;
# - a Cargo.toml version move on main is in no v* tag after 30 minutes.
# It keeps one tracking issue and closes it when every change is released.
#
# The `chain` step follows the current Cargo.toml version to an installable
# release: tag, a green release.yml run (whose publish step runs install.sh on
# the fleet Mac), a public release with every asset, releases/latest, and no
# bump pull request open past 120 minutes. It judges after 90 minutes and keeps
# one `release-blocked` issue; tools/metrics/release_notify.py on m3 messages
# the lead sessions when its failing step changes. It also runs when a release
# run finishes, so a recovery closes the issue promptly.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log findings but do not touch the tracking issue"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-cadence-check
  cancel-in-progress: false

jobs:
  check:
    # A fork inherits the schedule silently; it has nothing to report.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'danielraffel/Shipyard'
    runs-on: ubuntu-latest
    name: Check every merged change reached a release
    permissions:
      contents: read
      pull-requests: read
      issues: write
      # chain: the tag's release.yml run and the bump pull request's review-verdict.
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check merges and version bumps against tags
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release_watchdog.py "${args[@]}" cadence --grace-hours 2 --bump-grace-minutes 30

      - name: Check the current version reached an installable release
        # A failed cadence step must not hide the chain verdict.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          # Same focus release.yml builds for, so the expected asset set matches.
          CI_PLATFORM_FOCUS: ${{ vars.CI_PLATFORM_FOCUS || 'macos' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release_watchdog.py "${args[@]}" chain --bound-minutes 90 --bump-stale-minutes 120
