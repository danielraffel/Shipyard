name: Post-tag docs sync

# Installed by `shipyard release-bot hook install`. Shipyard-owned file:
# re-running the install command overwrites this file in place.

on:
  push:
    tags: ["v*"]

concurrency:
  group: shipyard-post-tag-sync
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  SHIPYARD_VERSION: "${{ github.ref_name }}"

jobs:
  sync:
    name: Regenerate docs for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          # Only the docs-sync step below receives the push token.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: stable

      - name: Build shipyard from the release tag
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin shipyard
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
          target/release/shipyard --version

      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Public client ID of the repository's release App. With no owner or
          # repositories input the token is scoped to this repository only.
          client-id: Iv23liTCzDQWqmMjkDTI
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Run post-tag docs sync
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Git credentials for this step only; nothing is written to .git/config.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          tag="${GITHUB_REF#refs/tags/}"
          shipyard release-bot hook run --tag "$tag"
