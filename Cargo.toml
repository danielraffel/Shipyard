[package]
name = "shipyard"
version = "0.149.0"
edition = "2024"
description = "Cross-platform CI coordination for local, SSH, and cloud runners."
repository = "https://github.com/danielraffel/Shipyard"
rust-version = "1.92"

[lib]
name = "shipyard"
path = "src/lib.rs"

[[bin]]
name = "shipyard"
path = "src/main.rs"

[[bin]]
name = "shipyard-workstream-provider"
path = "src/bin/shipyard-workstream-provider.rs"

[features]
# CI-only path isolation for production-shaped integration-test binaries.
# Official release builds never enable this feature.
ci-test-home = []

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
fs2 = "0.4.3"
flate2 = "1.1.2"
glob = "0.3.3"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
regex = "1.12.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
same-file = "1.0.6"
tempfile = "3.23.0"
tar = { version = "0.4.44", default-features = false }
toml = "0.8.23"
toml_edit = "0.22.27"
wait-timeout = "0.2.1"
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "user"] }
rustix = { version = "1.1.4", features = ["fs", "net", "pipe", "process", "thread"] }

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object"] }
winapi-util = "0.1.11"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
