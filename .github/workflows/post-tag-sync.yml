name: Post-tag docs sync

# Installed by `shipyard release-bot hook install`. Shipyard-owned file:
# re-running the install command overwrites this file in place; keep the
# `environment: release` line below when it does. RELEASE_BOT_TOKEN is a
# secret of that environment only (branch main and tags v*), never of the repo.

on:
  push:
    tags: ["v*"]

concurrency:
  group: shipyard-post-tag-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SHIPYARD_VERSION: "${{ github.ref_name }}"

jobs:
  sync:
    name: Regenerate docs for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout release tag with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          # Only the docs-sync step below receives the push token.
          persist-credentials: false

      - name: Require the tag to point at a commit on main
        # A v* tag is the only non-main ref the environment admits. Signing
        # must still never run on a commit that did not land on main.
        shell: bash
        run: |
          set -euo pipefail
          # The checkout above fetched full history, so origin/main is local.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF ($GITHUB_SHA) is not on main; refusing to continue." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: stable

      - name: Build shipyard from the release tag
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin shipyard
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
          target/release/shipyard --version


      - name: Run post-tag docs sync
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Git credentials for this step only; nothing is written to .git/config.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          tag="${GITHUB_REF#refs/tags/}"
          shipyard release-bot hook run --tag "$tag"
