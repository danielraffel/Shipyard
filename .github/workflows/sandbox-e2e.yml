name: Sandbox E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for sandbox jobs
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
          - local
      linux_runner_selector_json:
        description: Optional JSON string/array for Linux runs-on
        required: false
        default: ""
        type: string
      macos_arm64_runner_selector_json:
        description: Optional JSON string/array for macOS ARM64 runs-on
        required: false
        default: ""
        type: string

concurrency:
  group: sandbox-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        env:
          REQUESTED_PROVIDER: ${{ inputs.runner_provider || vars.DEFAULT_RUNNER_PROVIDER || 'github-hosted' }}
          EXPLICIT_LINUX_RUNNER_SELECTOR_JSON: ${{ inputs.linux_runner_selector_json || '' }}
          EXPLICIT_MACOS_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.macos_arm64_runner_selector_json || '' }}
          NAMESPACE_LINUX_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_RUNS_ON_JSON }}
          NAMESPACE_MACOS_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_MACOS_ARM64_RUNS_ON_JSON }}
        run: python3 scripts/ci_matrix.py --workflow sandbox-e2e --github-output

  sandbox:
    needs: resolve-runners
    name: ${{ matrix.name }} [${{ matrix.provider }}]
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin shipyard

      - name: Install pytest
        run: |
          python3 -m venv .venv-sandbox
          .venv-sandbox/bin/python -m pip install pytest

      - name: Run sandbox E2E
        # M3's ephemeral Tart runners use Shipyard-studio-NN. Keep the target,
        # provider, and host identity conjunctive so an explicit local selector
        # for M1/M5 cannot unexpectedly refresh that machine's production daemon.
        if: ${{ !(matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-')) }}
        env:
          SHIPYARD_BINARY_FOR_TEST: ${{ github.workspace }}/target/release/shipyard
        run: .venv-sandbox/bin/python -m pytest tools/sandbox-e2e/

      - name: Refresh M3 daemon to exact candidate and run focused Sandbox
        if: ${{ matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-') }}
        env:
          SHIPYARD_BINARY_FOR_TEST: ${{ github.workspace }}/target/release/shipyard
        run: |
          set -euo pipefail
          candidate="$(cd "$(dirname "$SHIPYARD_BINARY_FOR_TEST")" && pwd -P)/$(basename "$SHIPYARD_BINARY_FOR_TEST")"
          installed="$HOME/.local/bin/shipyard"
          test -x "$candidate"
          test -x "$installed"
          candidate_hash="$(shasum -a 256 "$candidate" | awk '{print $1}')"
          installed_hash="$(shasum -a 256 "$installed" | awk '{print $1}')"
          candidate_status="$($candidate --version)"
          installed_status="$($installed --version)"
          installed_argv="$(pgrep -f 'shipyard.*daemon run' | xargs -r ps -o command= -p 2>/dev/null || true)"
          "$installed" --json daemon status > "$RUNNER_TEMP/pre-refresh-daemon-status.json"
          jq -S '[(.registered_repos // [])[]] | sort' \
            "$RUNNER_TEMP/pre-refresh-daemon-status.json" \
            > "$RUNNER_TEMP/pre-refresh-registered-repos.json"
          "$installed" --json status > "$RUNNER_TEMP/pre-refresh-worker-status.json"
          record="$RUNNER_TEMP/shipyard-sandbox-bootstrap.json"
          jq -n \
            --arg candidate "$candidate" --arg candidate_hash "$candidate_hash" \
            --arg candidate_status "$candidate_status" \
            --arg installed "$installed" --arg installed_hash "$installed_hash" \
            --arg installed_status "$installed_status" --arg installed_argv "$installed_argv" \
            '{candidate:$candidate,candidate_sha256:$candidate_hash,candidate_status:$candidate_status,installed:$installed,installed_sha256:$installed_hash,installed_status:$installed_status,installed_argv:$installed_argv}' \
            > "$record"
          # Candidate proof exercises the daemon binary and writer-domain IPC,
          # not production webhook registration. Stop the installed daemon first
          # so a no-repo candidate cannot inherit its registrations. Removing the
          # Actions tracking marker keeps the detached daemon out of runner orphan
          # cleanup; the restore step stops it explicitly.
          "$installed" daemon stop
          /usr/bin/env -u RUNNER_TRACKING_ID "$candidate" daemon start
          "$candidate" --json daemon status > "$RUNNER_TEMP/candidate-daemon-status.json"
          jq -e '.running == true and ((.registered_repos // []) == [])' \
            "$RUNNER_TEMP/candidate-daemon-status.json"
          candidate_pid="$(pgrep -f "^${candidate//\//\\/} .*daemon run" | head -1)"
          test -n "$candidate_pid"
          ps -p "$candidate_pid" -o command= | grep -F -- "$candidate"
          if ps eww -p "$candidate_pid" -o command= | grep -q 'RUNNER_TRACKING_ID='; then
            echo "candidate daemon inherited Actions orphan tracking" >&2
            exit 1
          fi
          state_dir="$($candidate --json paths | jq -r .state_dir)"
          if lsof "$state_dir/.sandbox-writer-domain.lock" > "$RUNNER_TEMP/candidate-lock-holders.txt" 2>&1; then
            echo "candidate daemon retains an idle writer-domain lock" >&2
            cat "$RUNNER_TEMP/candidate-lock-holders.txt" >&2
            exit 1
          fi
          .venv-sandbox/bin/python -m pytest tools/sandbox-e2e/

      - name: Restore installed M3 daemon
        if: ${{ always() && matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-') }}
        run: |
          set -euo pipefail
          installed="$HOME/.local/bin/shipyard"
          test -x "$installed"
          test -s "$RUNNER_TEMP/pre-refresh-registered-repos.json"
          # Stop the candidate first so an empty saved list cannot implicitly
          # inherit its temporary Pulp-only registration. Rebuild the explicit
          # argv from the durable pre-refresh snapshot without eval or word splitting.
          "$installed" daemon stop
          restore_args=(daemon refresh)
          while IFS= read -r repo; do
            if [ -n "$repo" ]; then
              restore_args+=(--repo "$repo")
            fi
          done < <(jq -r '.[]' "$RUNNER_TEMP/pre-refresh-registered-repos.json")
          /usr/bin/env -u RUNNER_TRACKING_ID "$installed" "${restore_args[@]}"

      - name: Verify restored M3 daemon ownership
        if: ${{ always() && matrix.key == 'macos-arm64' && matrix.provider == 'local' && startsWith(runner.name, 'Shipyard-studio-') }}
        run: |
          set -euo pipefail
          installed="$HOME/.local/bin/shipyard"
          test -x "$installed"
          test -s "$RUNNER_TEMP/pre-refresh-registered-repos.json"
          test -s "$RUNNER_TEMP/pre-refresh-worker-status.json"
          # A separate step means the restoring shell is already gone. The delay
          # also crosses `daemon refresh`'s optimistic startup window.
          sleep 2
          "$installed" --json daemon status > "$RUNNER_TEMP/restored-daemon-status.json"
          jq -e '.running == true' "$RUNNER_TEMP/restored-daemon-status.json"
          jq -S '[(.registered_repos // [])[]] | sort' \
            "$RUNNER_TEMP/restored-daemon-status.json" \
            > "$RUNNER_TEMP/restored-registered-repos.json"
          cmp "$RUNNER_TEMP/pre-refresh-registered-repos.json" \
            "$RUNNER_TEMP/restored-registered-repos.json"
          installed_path="$(cd "$(dirname "$installed")" && pwd -P)/$(basename "$installed")"
          restored_pid="$(pgrep -f "^${installed_path//\//\\/} .*daemon run" | head -1)"
          test -n "$restored_pid"
          ps -p "$restored_pid" -o command= | grep -F -- "$installed_path"
          if ps eww -p "$restored_pid" -o command= | grep -q 'RUNNER_TRACKING_ID='; then
            echo "restored daemon inherited Actions orphan tracking" >&2
            exit 1
          fi
          "$installed" --json status > "$RUNNER_TEMP/restored-worker-status.json"
          jq -S '[.active_runs[]?.id] | sort' "$RUNNER_TEMP/pre-refresh-worker-status.json" \
            > "$RUNNER_TEMP/pre-refresh-worker-ids.json"
          jq -S '[.active_runs[]?.id] | sort' "$RUNNER_TEMP/restored-worker-status.json" \
            > "$RUNNER_TEMP/restored-worker-ids.json"
          cmp "$RUNNER_TEMP/pre-refresh-worker-ids.json" "$RUNNER_TEMP/restored-worker-ids.json"

      - name: Upload sandbox tempdir on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-e2e-${{ matrix.name }}-logs
          # Sandbox tempdirs come from tempfile.mkdtemp(...), which honors
          # TMPDIR/platform defaults. GitHub macOS runners use
          # /private/var/folders/... rather than /tmp, so cover both.
          path: |
            /tmp/shipyard-sandbox-e2e.*/**
            /private/var/folders/**/shipyard-sandbox-e2e.*/**
            /var/folders/**/shipyard-sandbox-e2e.*/**
          if-no-files-found: ignore
          retention-days: 7
