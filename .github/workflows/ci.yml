name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Native merge queue. A merge_group run has no inputs and must not read
  # vars.DEFAULT_RUNNER_PROVIDER, so it resolves to GitHub-hosted runners.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for CI jobs
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
          - local
      linux_runner_selector_json:
        description: Optional JSON string/array for Linux runs-on
        required: false
        default: ""
        type: string
      macos_arm64_runner_selector_json:
        description: Optional JSON string/array for macOS ARM64 runs-on
        required: false
        default: ""
        type: string
      windows_runner_selector_json:
        description: Optional JSON string/array for Windows runs-on
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      linux_runs_on_json: ${{ steps.resolve.outputs.linux_runs_on_json }}
      linux_provider: ${{ steps.resolve.outputs.linux_provider }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        env:
          # With GITHUB_EVENT_NAME and GITHUB_REPOSITORY, a fork PR skips self-hosted legs.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_PROVIDER: ${{ github.event_name == 'merge_group' && 'github-hosted' || inputs.runner_provider || vars.DEFAULT_RUNNER_PROVIDER || 'github-hosted' }}
          EXPLICIT_LINUX_RUNNER_SELECTOR_JSON: ${{ inputs.linux_runner_selector_json || '' }}
          EXPLICIT_MACOS_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.macos_arm64_runner_selector_json || '' }}
          EXPLICIT_WINDOWS_RUNNER_SELECTOR_JSON: ${{ inputs.windows_runner_selector_json || '' }}
          NAMESPACE_LINUX_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_RUNS_ON_JSON }}
          NAMESPACE_MACOS_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_MACOS_ARM64_RUNS_ON_JSON }}
          NAMESPACE_WINDOWS_RUNS_ON_JSON: ${{ vars.NAMESPACE_WINDOWS_RUNS_ON_JSON }}
        run: python3 scripts/ci_matrix.py --workflow ci --github-output

  test:
    needs: resolve-runners
    name: Test ${{ matrix.name }} [${{ matrix.provider }}]
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Assert Rust toolchain
        shell: bash
        run: |
          expected=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | awk '{print $2}')
          test "$actual" = "$expected"

      # Restore on GitHub-hosted runners only: self-hosted Macs keep target/
      # warm locally and never had an entry to restore. Only pushes to main
      # save, so PR runs read main's entry instead of writing their own.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          # Its macOS save hook invokes interactive `sudo purge`, which can
          # strand a self-hosted runner indefinitely.
          save-if: ${{ github.ref == 'refs/heads/main' && runner.os != 'macOS' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        env:
          # Never let a self-hosted runner's production Shipyard config alter
          # unit-test routing, auth, or mutation authority.
          SHIPYARD_TEST_HOME: ${{ runner.temp }}
          # The CLI dispatch enum is sized for the executable's normal stack.
          # Rust test-harness worker threads default smaller on Linux/Windows.
          RUST_MIN_STACK: 8388608
        run: cargo test --all-targets --locked --features ci-test-home

      - name: Run experimental authority refusal tests
        if: runner.os == 'Linux'
        env:
          SHIPYARD_TEST_HOME: ${{ runner.temp }}
          RUST_MIN_STACK: 8388608
        run: cargo test --all-targets --locked --features ci-test-home,experimental-authority-v5

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  coverage:
    needs: resolve-runners
    name: Coverage >= 75% [${{ needs.resolve-runners.outputs.linux_provider }}]
    if: needs.resolve-runners.outputs.linux_provider != 'skipped'
    runs-on: ${{ fromJSON(needs.resolve-runners.outputs.linux_runs_on_json) }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt

      - name: Assert Rust toolchain
        shell: bash
        run: |
          expected=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | awk '{print $2}')
          test "$actual" = "$expected"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1

      # Restore on GitHub-hosted runners only: self-hosted Macs keep target/
      # warm locally and never had an entry to restore. Only pushes to main
      # save, so PR runs read main's entry instead of writing their own.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          # Its macOS save hook invokes interactive `sudo purge`, which can
          # strand a self-hosted runner indefinitely.
          save-if: ${{ github.ref == 'refs/heads/main' && runner.os != 'macOS' }}

      - name: Run coverage gate
        env:
          # Coverage executes the same tests and must have the same clean
          # machine-global Shipyard boundary on self-hosted runners.
          SHIPYARD_TEST_HOME: ${{ runner.temp }}
          # Keep coverage's test workers identical to the ordinary test gate.
          RUST_MIN_STACK: 8388608
        run: cargo llvm-cov --locked --features ci-test-home --summary-only --fail-under-lines 75

  packaging-helper:
    needs: resolve-runners
    name: Python helper tests [${{ needs.resolve-runners.outputs.linux_provider }}]
    if: needs.resolve-runners.outputs.linux_provider != 'skipped'
    runs-on: ${{ fromJSON(needs.resolve-runners.outputs.linux_runs_on_json) }}
    steps:
      - uses: actions/checkout@v5

      - name: Run packaging helper tests
        # Passes only when unittest printed its own summary and it reads OK: a
        # bare `unittest discover` exits 0 when the process is ended mid-suite.
        run: python3 scripts/run_unittest_strict.py -s scripts -p 'test_*.py'

  # Names the cause of each failed job in this run as a `ci.cause/v1` record,
  # printed as a `::notice title=ci-cause::` annotation. A job's own log can be
  # downloaded only once it has finished, so this job reads the failed jobs'
  # finished logs and runs the pinned, checksum-verified
  # `shipyard cause extract` over each (scripts/ci_cause_notices.sh). It is
  # advisory: it never gates the run, and none of its failures fail it.
  ci-cause:
    name: ci-cause (advisory)
    needs: [test, coverage, packaging-helper]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci_cause_notices.sh
          sparse-checkout-cone-mode: false
      - name: Name the cause of each failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_cause_notices.sh
