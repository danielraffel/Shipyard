# Shipyard validates itself.
# This config is what runs when you do `shipyard run` in this repo.

# Formal GitHub stacks remain fail-closed. Repositories may select `observe`
# for exact-head plan telemetry; `apply` is reserved and currently NO-GO.
stacked_pr_mode = "off"

[project]
name = "shipyard"
type = "rust"
platforms = ["macos", "linux", "windows"]

# What CI runs (see .github/workflows/ci.yml). Keep in sync.
# Find a cargo whose sibling rustc satisfies this crate's declared MSRV. The
# `~/.cargo/bin/cargo` rustup shim can be broken after partial rustup updates,
# and a working older cargo can still fail before validation starts.
[validation.default]
command = "_sy_cargo_supports_msrv() { c=$(command -v \"$1\" 2>/dev/null) || return 1; d=$(dirname \"$c\"); r=\"$d/rustc\"; [ -x \"$r\" ] || return 1; need=$(awk -F'\"' '/^rust-version[[:space:]]*=/ { print $2; exit }' Cargo.toml); [ -n \"$need\" ] || return 1; have=$(\"$r\" --version 2>/dev/null | awk '{ print $2; exit }'); [ -n \"$have\" ] || return 1; awk -v have=\"$have\" -v need=\"$need\" 'BEGIN { split(have, h, \".\"); split(need, n, \".\"); for (i = 1; i <= 3; i++) { hv = h[i] + 0; nv = n[i] + 0; if (hv > nv) exit 0; if (hv < nv) exit 1 } exit 0 }' || return 1; PATH=\"$d:$PATH\" \"$c\" fmt --version >/dev/null 2>&1; }; _sy_find_cargo_bin() { for c in cargo \"$HOME/.cargo/bin/cargo\"; do _sy_cargo_supports_msrv \"$c\" && { dirname \"$(command -v \"$c\")\"; return 0; }; done; for c in \"$HOME\"/.rustup/toolchains/*/bin/cargo; do [ -x \"$c\" ] && _sy_cargo_supports_msrv \"$c\" && { dirname \"$c\"; return 0; }; done; return 1; }; CARGO_BIN=$(_sy_find_cargo_bin) || { echo 'shipyard validation: could not locate cargo, rustc, rustfmt, and clippy satisfying Cargo.toml rust-version' >&2; exit 1; }; export PATH=\"$CARGO_BIN:$PATH\"; SHIPYARD_TEST_HOME=$(mktemp -d \"${TMPDIR:-/tmp}/shipyard-test-home.XXXXXX\") || { echo 'shipyard validation: could not create isolated test home' >&2; exit 1; }; export SHIPYARD_TEST_HOME RUST_MIN_STACK=8388608; trap 'rm -rf -- \"$SHIPYARD_TEST_HOME\"' EXIT; cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --all-targets --locked --features ci-test-home"

[targets.mac]
backend = "local"
platform = "macos-arm64"
validation_build_type = "debug"

[release.changelog]
enabled    = true
path       = "CHANGELOG.md"
repo_url   = "https://github.com/danielraffel/Shipyard"
tag_filter = "v*"
product    = "Shipyard"
skip_commit_patterns = [
  "^chore: bump",
  "^chore\\(release\\):",
  "^bump .*to v?\\d+\\.\\d+\\.\\d+$",
]

[release.post_tag_hook]
enabled              = true
command              = "shipyard changelog regenerate"
watch                = ["CHANGELOG.md"]
trailers = [
  'Version-Bump: sdk=skip reason="docs-only automated regeneration"',
  'Skill-Update: skip skill=ci reason="no workflow shape change"',
  'Release: skip reason="bot commit; prevent recursive auto-release"',
]
only_for_tag_pattern = "v*"
max_push_attempts    = 5
# Shipyard dogfoods its hook while the triggering release is still a draft.
# Resolve the latest already-published, checksum-verified CLI instead of
# racing assets for the new tag. Consumer repositories remain pinned by
# default unless they opt into this explicitly.
workflow_shipyard_version = "latest"

[release.post_tag_hook.bot_identity]
name  = "shipyard-release-bot"
email = "shipyard-release-bot@users.noreply.github.com"
