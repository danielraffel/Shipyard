name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for release jobs
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - namespace
          - local
      linux_runner_selector_json:
        description: Optional JSON string/array for Linux x64 runs-on
        required: false
        default: ""
        type: string
      linux_arm64_runner_selector_json:
        description: Optional JSON string/array for Linux ARM64 runs-on
        required: false
        default: ""
        type: string
      macos_arm64_runner_selector_json:
        description: Optional JSON string/array for macOS ARM64 runs-on
        required: false
        default: ""
        type: string
      platform_focus:
        description: "Platforms to build (empty = repo variable CI_PLATFORM_FOCUS, default macos = macos-arm64 + linux-x64 + linux-arm64)"
        required: false
        default: ""
        type: string
      windows_runner_selector_json:
        description: Optional JSON string/array for Windows runs-on
        required: false
        default: ""
        type: string

# Each job grants only what its own steps use; nothing is granted by default.
permissions: {}

# One group across tags: a running release always finishes (it may be mid-
# signing on the local Mac), and a newer tag replaces any older release still
# waiting, so a burst of merges publishes the newest version instead of
# queueing one signing per merge.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      macos_arm64_runs_on_json: ${{ steps.resolve.outputs.macos_arm64_runs_on_json }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: resolve
        env:
          PLATFORM_FOCUS: ${{ inputs.platform_focus || vars.CI_PLATFORM_FOCUS || 'macos' }}
          REQUESTED_PROVIDER: ${{ inputs.runner_provider || vars.DEFAULT_RUNNER_PROVIDER || 'github-hosted' }}
          EXPLICIT_LINUX_RUNNER_SELECTOR_JSON: ${{ inputs.linux_runner_selector_json || '' }}
          EXPLICIT_LINUX_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.linux_arm64_runner_selector_json || '' }}
          EXPLICIT_MACOS_ARM64_RUNNER_SELECTOR_JSON: ${{ inputs.macos_arm64_runner_selector_json || '' }}
          EXPLICIT_WINDOWS_RUNNER_SELECTOR_JSON: ${{ inputs.windows_runner_selector_json || '' }}
          NAMESPACE_LINUX_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_RUNS_ON_JSON }}
          NAMESPACE_LINUX_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_LINUX_ARM64_RUNS_ON_JSON }}
          NAMESPACE_MACOS_ARM64_RUNS_ON_JSON: ${{ vars.NAMESPACE_MACOS_ARM64_RUNS_ON_JSON }}
          NAMESPACE_WINDOWS_RUNS_ON_JSON: ${{ vars.NAMESPACE_WINDOWS_RUNS_ON_JSON }}
        run: python3 scripts/ci_matrix.py --workflow release --github-output

  build:
    needs: resolve-runners
    name: Build ${{ matrix.package_target }} [${{ matrix.provider }}]
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate release runner architecture
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "${{ matrix.package_target }}" in
            linux-arm64|macos-arm64)
              echo "$machine" | grep -Eq '^(aarch64|arm64)$'
              ;;
            linux-x64|windows-x64)
              echo "$machine" | grep -Eq '^(x86_64|amd64)$'
              ;;
            *)
              echo "unknown package target: ${{ matrix.package_target }}" >&2
              exit 2
              ;;
          esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-13
        with:
          toolchain: stable

      # No cargo cache: release binaries build from a clean target/, and a tag
      # ref can only restore its own or main's entries, neither of which holds
      # a release-profile build, so the cache never hit and only filled quota.
      - name: Build release binaries
        run: cargo build --release --locked --bin shipyard --bin shipyard-workstream-provider

      - name: Package non-macOS artifact
        if: matrix.package_target != 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} scripts/package_release.py \
            --skip-build \
            --binary "${{ matrix.binary }}" \
            --companion-binary "${{ matrix.companion_binary }}" \
            --target "${{ matrix.package_target }}" \
            --tag "${{ github.ref_name }}" \
            --dist-dir artifacts/release

      - name: Upload non-macOS artifact
        id: upload_artifact
        if: matrix.package_target != 'macos-arm64'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.package_target }}
          path: artifacts/release/${{ github.ref_name }}/*
          if-no-files-found: error

      - name: Write non-macOS artifact identity manifest
        if: matrix.package_target != 'macos-arm64'
        env:
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 scripts/release_artifact_manifest.py write \
            --output artifacts/release-manifest.json \
            --root "artifacts/release/${GITHUB_REF_NAME}" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --target "${{ matrix.package_target }}" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST"

      - name: Upload non-macOS artifact identity manifest
        if: matrix.package_target != 'macos-arm64'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.package_target }}-manifest
          path: artifacts/release-manifest.json
          if-no-files-found: error

      - name: macOS build health check only
        if: matrix.package_target == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          target/release/shipyard --version
          target/release/shipyard-workstream-provider --version
          echo "macOS release artifacts are intentionally not uploaded from this unsigned build."
          echo "Run scripts/release-macos-local.sh --tag ${{ github.ref_name }} --upload to sign, notarize, upload, verify, and publish."

  # Release gate: the built binary's bulk GitHub reads must succeed against a
  # real repository before anything is published. v0.302.0-v0.307.0 shipped an
  # admission census GitHub refused on every call (GraphQL node limit) and no
  # unit test against a fake could see it. Read-only probes only.
  live-smoke:
    needs: build
    name: Live GitHub smoke (release gate)
    runs-on: ubuntu-latest
    # The job token is handed to the binary under test: read-only, nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the linux-x64 release binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-linux-x64
          path: smoke-bin

      - name: Run read-only admission and steward probes against real repositories
        shell: bash
        env:
          # Prefer a dedicated read-only token. The Actions token remains the
          # fallback; never expose the write-capable release-bot credential to
          # the binary under test.
          GH_TOKEN: ${{ secrets.RELEASE_SMOKE_GH_TOKEN || github.token }}
          SMOKE_REPOS: ${{ vars.RELEASE_SMOKE_REPOS || 'Generous-Corp/pulp' }}
        run: |
          set -euo pipefail
          binary=smoke-bin/shipyard-linux-x64
          chmod +x "$binary"
          "$binary" --version
          repo_args=()
          for repo in $SMOKE_REPOS; do repo_args+=(--repo "$repo"); done
          python3 scripts/release_live_smoke.py --binary "$binary" "${repo_args[@]}"

  release:
    needs: [build, live-smoke]
    runs-on: ubuntu-latest
    # Run the gate even when live-smoke failed so a `gh run rerun --failed`
    # retries both jobs. Successful build artifacts stay attached to this run;
    # a later smoke pass can therefore reach publication without rebuilding.
    # The first step below remains fail-closed and prevents any release write.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    # Creates the draft release (contents) and signs its build provenance.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require verified build and live smoke
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LIVE_SMOKE_RESULT: ${{ needs.live-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != success || "$LIVE_SMOKE_RESULT" != success ]]; then
            echo "release withheld: build=$BUILD_RESULT live-smoke=$LIVE_SMOKE_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download non-macOS artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts/

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t manifests < <(find artifacts -path '*/release-manifest.json' -type f -print)
          test "${#manifests[@]}" -gt 0
          manifest_args=()
          for manifest in "${manifests[@]}"; do
            manifest_args+=(--manifest "$manifest")
          done
          python3 scripts/release_artifact_manifest.py aggregate \
            --output release/shipyard-release-manifest.json \
            --artifacts-root artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${manifest_args[@]}"
          find artifacts -type f ! -name checksums.sha256 ! -name release-manifest.json -print0 | while IFS= read -r -d '' file; do
            cp "$file" release/
          done
          test "$(find release -type f | wc -l | tr -d ' ')" -gt 0
          cd release
          sha256sum -- * > checksums.sha256

      # Sigstore (fulcio/rekor) has transient TLS and 5xx failures. An attestation
      # is required before any host will install the release, so retry with
      # backoff instead of failing the release on one bad handshake. A
      # deterministic failure fails all three attempts and the job.
      - name: Attest non-macOS release assets (attempt 1)
        id: attest_nonmac_1
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe
      - name: Back off before retrying attestation
        if: steps.attest_nonmac_1.outcome == 'failure'
        run: sleep 30
      - name: Attest non-macOS release assets (attempt 2)
        id: attest_nonmac_2
        if: steps.attest_nonmac_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe
      - name: Back off before the last attestation attempt
        if: steps.attest_nonmac_2.outcome == 'failure'
        run: sleep 90
      - name: Attest non-macOS release assets (attempt 3)
        if: steps.attest_nonmac_2.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/shipyard-linux-*
            release/shipyard-windows-*.exe
            release/shipyard-workstream-provider-linux-*
            release/shipyard-workstream-provider-windows-*.exe

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          draft: true

  sign-and-upload-macos:
    needs: [resolve-runners, release]
    # Keep this gate rerunnable with `gh run rerun --failed` when the release
    # job withheld publication after a transient smoke failure.
    if: always() && startsWith(github.ref, 'refs/tags/v') && vars.CI_MACOS_SIGNING_ENABLED == 'true'
    runs-on: ${{ fromJSON(needs.resolve-runners.outputs.macos_arm64_runs_on_json) }}
    # Backstop over the per-step timeouts below (toolchain 45 + identity 10 +
    # sign/notarize 115 + attestation 15 and its 2 min of backoff + publish 20),
    # so a stall can never hold the release draft for the 6-hour default. The
    # always() keychain restore still runs when the job is cancelled.
    timeout-minutes: 220
    # Uploads the DMG and publishes the release (contents) after attesting it.
    permissions:
      attestations: write
      contents: write
      id-token: write
    # Exact pins for the fixed-path toolchain. Bump the toolchain together
    # with the version `stable` resolves to in the build matrix. The rustup-init
    # SHA-256 is static.rust-lang.org/rustup/archive/<version>/aarch64-apple-darwin/rustup-init.sha256.
    env:
      SHIPYARD_RELEASE_RUST_TOOLCHAIN: "1.99.1"
      SHIPYARD_RELEASE_RUSTUP_VERSION: "1.29.3"
      SHIPYARD_RELEASE_RUSTUP_INIT_SHA256: "63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f"
    steps:
      - name: Require published non-macOS release gate
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_RESULT" != success ]]; then
            echo "macOS publication withheld: release=$RELEASE_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify job-scoped GitHub publication before signing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from release_macos_local import require_ci_gh; print(require_ci_gh())'

      # The signed build must not read a toolchain or crate sources that an
      # earlier job on a shared runner could have written to ~/.cargo or
      # ~/.rustup, so it never uses those homes. The runners sit behind an
      # interactive outbound firewall (LuLu) that approves each executable
      # path once; a toolchain installed under a fresh per-run directory was a
      # new path every release and stalled at "syncing channel updates" until
      # someone clicked Allow. So rustup and the pinned toolchain live at one
      # fixed path per runner user, verified by pinned SHA-256 (rustup-init),
      # exact version and a recorded tree digest, and installed under a flock.
      # Only the toolchain is shared: CARGO_HOME (crate registry) is fresh per
      # run and target/ is the clean checkout's. See scripts/ci_macos_release_rust.py.
      # static.rust-lang.org is unreachable from the self-hosted runner for
      # minutes at a time; v0.381.0 and v0.383.0 stayed drafts on it. The
      # script retries with backoff, and the auto-release heal job re-runs
      # what remains.
      - name: Install pinned Rust toolchain at the fixed runner path
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_macos_release_rust.py \
            --root "${HOME:?}/.shipyard-release-rust" \
            --toolchain "$SHIPYARD_RELEASE_RUST_TOOLCHAIN" \
            --host aarch64-apple-darwin \
            --rustup-version "$SHIPYARD_RELEASE_RUSTUP_VERSION" \
            --rustup-init-sha256 "$SHIPYARD_RELEASE_RUSTUP_INIT_SHA256" \
            --run-cargo-home "${RUNNER_TEMP:?}/shipyard-cargo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
      - name: Verify the release build uses the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "cargo: $(command -v cargo)"
          echo "rustc: $(command -v rustc)"
          rustc --version
          cargo --version
          case "$(command -v cargo)" in
            "$RUSTUP_HOME/toolchains/$RUSTUP_TOOLCHAIN/bin/cargo") ;;
            *) echo "cargo resolves outside the pinned toolchain" >&2; exit 1 ;;
          esac
          rustc --version | grep -q "^rustc ${SHIPYARD_RELEASE_RUST_TOOLCHAIN} "

      # No cargo cache: release binaries build from a clean target/, and a tag
      # ref can only restore its own or main's entries, neither of which holds
      # a release-profile build, so the cache never hit and only filled quota.
      - name: Import Developer ID signing identity
        # security import / set-key-partition-list can block on a GUI prompt.
        timeout-minutes: 10
        env:
          SIGN_P12_B64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          SIGN_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SIGN_P12_B64:-}" ] || missing+=("MACOS_SIGN_P12_BASE64")
          [ -n "${SIGN_P12_PASSWORD:-}" ] || missing+=("MACOS_SIGN_P12_PASSWORD")
          [ -n "${SIGN_TEAM_ID:-}" ] || missing+=("MACOS_NOTARIZE_TEAM_ID")
          [ -n "${NOTARIZE_APPLE_ID:-}" ] || missing+=("MACOS_NOTARIZE_APPLE_ID")
          [ -n "${NOTARIZE_APP_PASSWORD:-}" ] || missing+=("MACOS_NOTARIZE_APP_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'required secret missing when CI_MACOS_SIGNING_ENABLED=true: %s\n' "${missing[@]}" >&2
            exit 2
          fi
          KEYCHAIN="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.keychain-db"
          KEYCHAIN_STATE="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.json"
          SIGNING_HOME="${RUNNER_TEMP}/shipyard-ci-home-${GITHUB_RUN_ID}"
          CERT_PATH="${RUNNER_TEMP}/shipyard-cert-${GITHUB_RUN_ID}.p12"
          {
            echo "SHIPYARD_SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "SHIPYARD_SIGNING_KEYCHAIN_STATE=$KEYCHAIN_STATE"
            echo "SHIPYARD_SIGNING_HOME=$SIGNING_HOME"
          } >> "$GITHUB_ENV"
          python3 scripts/ci_macos_signing_keychain.py prepare \
            --keychain "$KEYCHAIN" \
            --state "$KEYCHAIN_STATE" \
            --signing-home "$SIGNING_HOME"
          echo "$SIGN_P12_B64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          IDENTITY_SHA="$(security find-identity -p codesigning -v "$KEYCHAIN" \
            | awk -v team="(${SIGN_TEAM_ID})" '/Developer ID Application/ && index($0, team) {print $2; exit}')"
          if [ -z "$IDENTITY_SHA" ]; then
            echo "no Developer ID Application identity for Team ID ${SIGN_TEAM_ID} found in CI keychain" >&2
            exit 2
          fi
          echo "SHIPYARD_SIGNING_IDENTITY=$IDENTITY_SHA" >> "$GITHUB_ENV"
          echo "SHIPYARD_SIGNING_KEYCHAIN_READY=1" >> "$GITHUB_ENV"

      # notarytool's own --timeout bounds only the wait for Apple's verdict;
      # v0.398.0 sat in `notarytool submit --wait` for hours with no
      # submission reaching Apple. package_release.py caps every notarytool
      # process, retries a stalled or failed attempt with backoff, and logs
      # the submission id. This limit covers those retries plus the build.
      - name: Sign, notarize, staple, and upload macOS DMG
        timeout-minutes: 115
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The publish gate expects the same asset set the build matrix produced.
          CI_PLATFORM_FOCUS: ${{ inputs.platform_focus || vars.CI_PLATFORM_FOCUS || 'macos' }}
          SHIPYARD_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          SHIPYARD_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          SHIPYARD_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Upload only: the release stays a draft until the DMG is attested
          # (next steps), so no host can install a published, unattested build.
          scripts/release-macos-local.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --upload \
            --defer-publish \
            --ci-mode

      # Sigstore (fulcio/rekor) has transient TLS and 5xx failures. An attestation
      # is required before any host will install the release, so retry with
      # backoff instead of failing the release on one bad handshake. A
      # deterministic failure fails all three attempts and the job.
      - name: Attest signed and notarized macOS release asset (attempt 1)
        timeout-minutes: 5
        id: attest_macos_1
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg
      - name: Back off before retrying attestation
        if: steps.attest_macos_1.outcome == 'failure'
        run: sleep 30
      - name: Attest signed and notarized macOS release asset (attempt 2)
        timeout-minutes: 5
        id: attest_macos_2
        if: steps.attest_macos_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg
      - name: Back off before the last attestation attempt
        if: steps.attest_macos_2.outcome == 'failure'
        run: sleep 90
      - name: Attest signed and notarized macOS release asset (attempt 3)
        timeout-minutes: 5
        if: steps.attest_macos_2.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/${{ github.ref_name }}/shipyard-macos-arm64.dmg

      - name: Publish the attested release
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release-macos-local.sh \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --publish-only \
            --ci-mode

      - name: Restore user keychains and delete ephemeral signing keychain
        if: always()
        shell: bash
        run: |
          KEYCHAIN="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.keychain-db"
          KEYCHAIN_STATE="${RUNNER_TEMP}/shipyard-ci-sign-${GITHUB_RUN_ID}.json"
          SIGNING_HOME="${RUNNER_TEMP}/shipyard-ci-home-${GITHUB_RUN_ID}"
          rm -f "${RUNNER_TEMP}/shipyard-cert-${GITHUB_RUN_ID}.p12"
          # An earlier step failed before the keychain was prepared: nothing to
          # restore, and failing here would hide the real error.
          if [ ! -e "$KEYCHAIN_STATE" ]; then
            echo "no signing keychain was prepared; nothing to restore"
            exit 0
          fi
          python3 scripts/ci_macos_signing_keychain.py restore \
            --keychain "$KEYCHAIN" \
            --state "$KEYCHAIN_STATE" \
            --signing-home "$SIGNING_HOME"
