name: Assign versions at land

# PRs never carry the shared version counters. This single writer runs after
# every push to main, assigns the highest required level in the unprocessed
# range, and commits the files to the bot-owned release/version-at-land branch.
# Main's ruleset requires checks only a pull request carries, so the bump lands
# through one coalesced pull request: every run rebuilds that branch from the
# main tip with the cumulative bump and keeps the same pull request open. The
# pull request is handed to the merge steward (managed label plus an exact-head
# handoff status) and still needs green required checks and a reviewer's
# exact-head approval. auto-release.yml tags its merge. A run on that merge has
# nothing left to assign and is a no-op.
#
# RELEASE_BOT_TOKEN pushes the branch and opens the pull request: events from
# the default workflow token start no workflows, and the required checks must
# run on the pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-at-land
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    # Release secrets live in the `release` environment, which only main can use.
    environment:
      name: release
      deployment: false
    steps:
      - name: Checkout main with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Assign the next version
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: shipyard-release-bot
          GIT_AUTHOR_EMAIL: shipyard-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: shipyard-release-bot
          GIT_COMMITTER_EMAIL: shipyard-release-bot@users.noreply.github.com
        run: |
          test -n "$RELEASE_BOT_TOKEN" || { echo 'RELEASE_BOT_TOKEN is required; refusing to land an untagged version bump.' >&2; exit 1; }
          python3 scripts/version_at_land.py --push --pr-branch release/version-at-land \
            --repo "$GITHUB_REPOSITORY" --target-url "$RUN_URL" --json
