name: Version ahead of main (sweep)

# A PR's version gate passed against the main it was cut from. When main
# moves, every open PR is re-judged against the new main, and a PR whose
# version is no longer strictly ahead gets a failing
# `shipyard/version-ahead-of-main` status instead of merging a duplicate,
# untagged version.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-ahead-sweep
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Re-judge open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          python3 scripts/version_ahead_of_main.py sweep \
              --repo "${{ github.repository }}" \
              --main-ref origin/main
