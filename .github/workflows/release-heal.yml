name: Release Heal

# release.yml keeps a release a draft until its final job attests and publishes
# the DMG. When that run fails (for example a runner that cannot reach
# static.rust-lang.org) nothing retried it. This workflow re-runs the failed
# jobs of the current version's release run, bounded, or fails with the reason.
# It lives apart from auto-release.yml because tooling reads that workflow's run
# history as the tagging chain (doctor --release-chain, release-bot verify).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: release-heal
  cancel-in-progress: false

permissions: {}

jobs:
  heal:
    runs-on: ubuntu-latest
    name: Recover a stuck draft release
    # contents: write only so draft releases are listed; this job never edits one.
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Re-run a failed release run or fail with the reason
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MACOS_SIGNING_ENABLED: ${{ vars.CI_MACOS_SIGNING_ENABLED }}
        run: python3 scripts/release_draft_heal.py
